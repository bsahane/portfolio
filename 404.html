<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a0e14" />
<title>404 — bsahane ~/portfolio</title>
<style>
 @font-face { font-family: 'JetBrains Mono'; font-weight: 400 800; font-display: swap; src: url('/fonts/jetbrains-mono-latin-normal.woff2') format('woff2'); }
 * { box-sizing: border-box; margin: 0; }
 html, body { height: 100%; }
 body {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  background: #0a0e14; color: #e6edf3;
  display: grid; place-items: center; padding: 24px;
 }
 main { width: 100%; max-width: 560px; }
 .win { border: 1px solid #30363d; border-radius: 12px; background: #0f141b; overflow: hidden; }
 .bar { padding: 12px 16px; border-bottom: 1px solid #1e252e; color: #94a3b8; font-size: 13px; }
 .body { padding: 24px; font-size: 15px; line-height: 1.7; }
 .p { color: #39d353; }
 .err { color: #ff7b72; }
 .m { color: #94a3b8; }
 h1 { font-size: inherit; font-weight: 400; }
 a { color: #39d353; text-underline-offset: 3px; }
 a:focus-visible { outline: 2px solid #39d353; outline-offset: 3px; border-radius: 2px; }
 ::selection { background: rgba(57, 211, 83, 0.3); }
</style>
</head>
<body>
<main>
 <div class="win">
  <div class="bar">bsahane ~/portfolio</div>
  <div class="body">
   <p><span class="p">$</span> <span>cd</span> <span class="m">this-page</span></p>
   <h1 class="err">404: no such file or directory</h1>
   <p><span class="p">$</span> <a href="/">cd ~</a> <span class="m"># back to the portfolio</span></p>
  </div>
 </div>
</main>
</body>
</html>
