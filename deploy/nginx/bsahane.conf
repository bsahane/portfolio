# bhushan.sahane.in — served from CT 118, reached through the Cloudflare tunnel.
# Install: /etc/nginx/sites-available/bsahane (symlinked into sites-enabled)
#          /etc/nginx/snippets/bsahane-headers.conf

# Behind the tunnel every request comes from the Proxmox host, so $remote_addr
# is one address for all visitors. Key on the visitor IP Cloudflare forwards.
limit_req_zone $http_cf_connecting_ip zone=bsahane_api:1m rate=12r/m;

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /var/www/html;
	index index.html;
	charset utf-8;
	server_tokens off;

	error_page 404 /404.html;

	include snippets/bsahane-headers.conf;

	# HTML revalidates on every visit (ETag makes that a 304), so a deploy is
	# live immediately.
	location / {
		try_files $uri $uri/ =404;
		include snippets/bsahane-headers.conf;
		add_header Cache-Control "no-cache" always;
	}

	# Stable assets: fonts, the share card, the licence.
	location ~* ^/(fonts/|og\.png$) {
		include snippets/bsahane-headers.conf;
		add_header Cache-Control "public, max-age=2592000" always;
		access_log off;
	}

	location = /404.html { internal; }

	# The page probes health once per load and it costs nothing upstream, so it
	# must not share the chat's budget — reloading a few times was enough to
	# 429 it and downgrade the badge.
	location = /api/health {
		proxy_pass http://127.0.0.1:8787/health;
		proxy_read_timeout 5s;
		include snippets/bsahane-headers.conf;
		add_header Cache-Control "no-store" always;
	}

	# Terminal AI proxy (proxy.py via systemd). Small bodies, bounded time, and
	# a per-visitor rate so nobody can run up the upstream bill.
	location /api/ {
		limit_req zone=bsahane_api burst=6 nodelay;
		limit_req_status 429;
		client_max_body_size 32k;
		proxy_pass http://127.0.0.1:8787/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_read_timeout 25s;
		include snippets/bsahane-headers.conf;
		add_header Cache-Control "no-store" always;
	}

	location ~ /\. { deny all; }
}
